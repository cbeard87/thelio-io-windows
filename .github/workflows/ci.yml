name: CI
on:
  push:
    branches: '**'
    tags-ignore: '**'
  pull_request:
  release:
    types: [published]
permissions:
  contents: write
jobs:
    build:
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  lfs: true
            - uses: dtolnay/rust-toolchain@1.82.0
            - run: choco install dotnet-8.0-sdk python3 wixtoolset
            - run: cargo install cargo-wix
            - env:
                  SSL_COM_USERNAME: ${{ github.event_name == 'release' && secrets.SSL_COM_USERNAME || '' }}
                  SSL_COM_PASSWORD: ${{ github.event_name == 'release' && secrets.SSL_COM_PASSWORD || '' }}
                  SSL_COM_CREDENTIAL_ID: ${{ github.event_name == 'release' && secrets.SSL_COM_CREDENTIAL_ID || '' }}
                  SSL_COM_TOTP_SECRET: ${{ github.event_name == 'release' && secrets.SSL_COM_TOTP_SECRET || '' }}
                  SIGN: ${{ github.event_name == 'release' && secrets.SSL_COM_USERNAME != '' && '--sign' || '' }}
              run: python build.py $Env:SIGN
            - uses: actions/upload-artifact@v4
              with:
                  name: thelio-io
                  path: |
                      target/wix/thelio-io-*.msi
                      target/sign/thelio-io-*.msi
                  if-no-files-found: warn
            - name: Attach installer to release
              if: github.event_name == 'release'
              uses: softprops/action-gh-release@v2
              with:
                  files: |
                      target/wix/thelio-io-*.msi
                      target/sign/thelio-io-*.msi
                  fail_on_unmatched_files: false
